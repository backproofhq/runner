version: "2"

run:
  build-tags:
    - integration
    - sealinterop

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - noctx
    - nolintlint
    - sloglint
    - unconvert
  settings:
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print.*|print|println)$
          msg: Use log/slog for logs, or write to the command's output stream.
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      no-global: all
      context: all

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/backproofhq/runner
