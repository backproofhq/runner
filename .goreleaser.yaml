# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: backproof

builds:
  - id: backproof
    main: ./cmd/backproof
    binary: backproof
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/backproofhq/runner/internal/version.version={{ .Version }}
      - -X github.com/backproofhq/runner/internal/version.commit={{ .ShortCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: ./scripts/install.sh

# One SPDX document per archive, made with Syft. The images carry their own SBOM attestation.
sboms:
  - artifacts: archive

# Keyless signing with the release workflow's GitHub identity. Snapshot builds pass --skip=sign,
# because signing would otherwise ask for a browser sign-in. checksums.txt covers every
# archive, SBOM and install.sh, so its signature covers them too.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

docker_signs:
  - cmd: cosign
    args:
      - sign
      - ${artifact}@${digest}
      - --yes

snapshot:
  version_template: "0.0.0-dev+{{ .ShortCommit }}"

dockers_v2:
  - id: runner
    ids:
      - backproof
    images:
      - backproofhq/runner
    # latest and the short tags move only on stable releases, so a pre-release never reaches
    # people who install the latest version. Snapshots are tagged dev.
    tags:
      - "{{ if .IsSnapshot }}dev{{ else }}{{ .Version }}{{ end }}"
      - "{{ if and (not .Prerelease) (not .IsSnapshot) }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if and (not .Prerelease) (not .IsSnapshot) }}{{ .Major }}{{ end }}"
      - "{{ if and (not .Prerelease) (not .IsSnapshot) }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: Backproof runner
      org.opencontainers.image.source: https://github.com/backproofhq/runner
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

# The release workflow passes the version's section of CHANGELOG.md with --release-notes, which
# replaces the changelog generated from commits. Disabling the changelog would drop those notes too.

release:
  github:
    owner: backproofhq
    name: runner
  # A pre-release such as v0.2.0-beta.1 is never GitHub's latest release, which get.backproof.dev
  # redirects to.
  prerelease: auto
  make_latest: "{{ not .Prerelease }}"
  extra_files:
    - glob: ./scripts/install.sh
